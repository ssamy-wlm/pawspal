# The gate. Every push to main and every pull request must pass all of this.
# deploy.yml only runs after this workflow succeeds on main.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Dependency audit gate
        run: node ../../scripts/audit-gate.mjs
      - name: Audit gate self-test
        working-directory: .
        run: node --test scripts/audit-gate.test.mjs
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Migration safety check
        run: |
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; fi
          python3 scripts/check-migrations.py "${base:-ROOT}"
      - name: Migrations and security tests
        run: bash scripts/test-db.sh
