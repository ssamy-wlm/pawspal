# Goes live after ci passes on main.
#  - Database: the Supabase GitHub integration deploys migrations from the `production` branch.
#    This workflow moves `production` to the tested commit, so only commits that passed ci reach the
#    live database. No Supabase secrets are used anywhere.
#  - App: over-the-air update, or a store build when native code changed. Needs the EXPO_TOKEN secret;
#    skipped with a note until it exists.
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: write   # moves the `production` branch and the `deployed-mobile` tag
# One deploy at a time, in order. Never cancel a deploy that is half way.
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  database:
    name: Release to the Supabase integration
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Fast-forward the production branch
        run: |
          # Plain push (never forced): fails safely if production is not an ancestor of this commit.
          git push origin "${{ github.event.workflow_run.head_sha }}:refs/heads/production"
          echo "### Database" >> "$GITHUB_STEP_SUMMARY"
          echo "\`production\` now points at the tested commit. The Supabase GitHub integration deploys its migrations." >> "$GITHUB_STEP_SUMMARY"

  mobile:
    name: Expo update or build
    if: github.event.workflow_run.conclusion == 'success'
    needs: database   # the database goes first, so a new app never meets an old schema
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Expo deploy skipped::Missing GitHub secret EXPO_TOKEN. Add it (see SETUP.md) and the next push will deploy."
            echo "### Expo deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing secret EXPO_TOKEN. See SETUP.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Check the Expo project is linked
        id: linked
        if: steps.gate.outputs.run == 'true'
        run: |
          if grep -q 'u.expo.dev' apps/mobile/app.json && grep -q '"projectId"' apps/mobile/app.json; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Expo deploy skipped::apps/mobile/app.json has no Expo project id or update URL yet. Run the one-time link step in SETUP.md."
            echo "### Expo deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The Expo project is not linked yet (no projectId / updates.url in app.json). See SETUP.md." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.linked.outputs.run == 'true'
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        if: steps.linked.outputs.run == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Did native code change?
        id: native
        if: steps.linked.outputs.run == 'true'
        run: bash scripts/native-changed.sh | tee -a "$GITHUB_OUTPUT"
      - name: Install app dependencies
        if: steps.linked.outputs.run == 'true'
        working-directory: apps/mobile
        run: npm ci
      - name: Over-the-air update
        if: steps.linked.outputs.run == 'true' && steps.native.outputs.native_changed == 'false'
        working-directory: apps/mobile
        run: eas update --channel production --auto --non-interactive
      - name: Store build and submit
        if: steps.linked.outputs.run == 'true' && steps.native.outputs.native_changed == 'true'
        working-directory: apps/mobile
        run: eas build --platform all --profile production --auto-submit --non-interactive
      - name: Mark mobile as deployed
        if: steps.linked.outputs.run == 'true'
        run: |
          git tag -f deployed-mobile "${{ github.event.workflow_run.head_sha }}"
          git push -f origin refs/tags/deployed-mobile
