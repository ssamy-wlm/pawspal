<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2D3D">
<title>PawsPal is offline</title>
<style>
  html,body{margin:0;min-height:100%;background:#1F2D3D;color:#FFF7EC;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  main{box-sizing:border-box;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 24px;text-align:center}
  img{width:96px;height:96px;border-radius:24px}
  section{max-width:340px}
  h1{margin:0 0 8px;font-size:24px;line-height:1.3}
  p{margin:0;font-size:17px;line-height:1.5;color:#C3CCD5}
  hr{width:48px;border:0;border-top:3px solid #3BC0C0;margin:0}
  a.again{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:48px;padding:0 28px;border-radius:999px;background:#FF9F43;color:#1F2D3D;font-size:17px;font-weight:600;text-decoration:none}
  a.again:focus-visible{outline:3px solid #3BC0C0;outline-offset:3px}
  [dir="rtl"]{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="96" height="96">
  <section lang="en" dir="ltr">
    <h1>You are offline</h1>
    <p>PawsPal needs the internet to show hosts, pets and chats. Check your connection and try again.</p>
  </section>
  <hr>
  <section lang="ar" dir="rtl">
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>يحتاج PawsPal إلى الإنترنت ليعرض المضيفين والحيوانات والمحادثات. تحقق من اتصالك ثم حاول مرة أخرى.</p>
  </section>
  <a class="again" href="/">Try again · حاول مرة أخرى</a>
</main>
</body>
</html>
